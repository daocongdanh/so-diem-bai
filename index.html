<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#155b45">
    <meta name="description" content="Sổ điểm đơn giản: thêm người chơi và cộng trừ 2 điểm mỗi lần bấm.">
    <title>Sổ điểm</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23155b45'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-size='46' fill='white'%3E♠%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="scorebook">
      <header class="heading">
        <div>
          <span class="eyebrow">♠ CẢ HỘI CÙNG CHƠI</span>
          <h1>Sổ điểm</h1>
          <p>Bấm nhẹ một cái, ghi ngay hai điểm.</p>
        </div>
        <button id="add-player" class="add-button" type="button">
          <span aria-hidden="true">+</span> Thêm người chơi
        </button>
      </header>

      <section aria-label="Điểm người chơi">
        <div class="list-heading">
          <h2>Người chơi <span id="player-count">0</span></h2>
          <span id="save-status" class="save-status" role="status">Tự lưu trên thiết bị</span>
        </div>
        <div id="players" class="player-list"></div>
        <div id="empty-state" class="empty-state">
          <span class="empty-icon" aria-hidden="true">♣</span>
          <h2>Hội mình có những ai?</h2>
          <p>Bấm <strong>+ Thêm người chơi</strong> để bắt đầu.</p>
        </div>
      </section>

      <footer>Mỗi lần bấm <strong>−2</strong> hoặc <strong>+2</strong> điểm.</footer>
    </main>

    <dialog id="player-dialog">
      <form id="player-form">
        <div class="dialog-heading">
          <h2>Thêm người chơi</h2>
          <button id="close-dialog" class="close-button" type="button" aria-label="Đóng">×</button>
        </div>
        <label for="player-name">Tên người chơi</label>
        <input id="player-name" name="name" type="text" maxlength="40" placeholder="Nhập tên hoặc biệt danh" autocomplete="off" required>
        <p id="name-error" class="error" role="alert"></p>
        <button type="submit" class="submit-button">Thêm vào bàn</button>
      </form>
    </dialog>
  </body>
</html>
